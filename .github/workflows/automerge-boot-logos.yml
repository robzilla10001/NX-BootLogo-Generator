name: Auto-merge bootlogos-only PRs
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: List changed files
        id: files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/pulls/${PR_NUMBER}/files" --paginate \
            --jq '.[].filename' > changed_files.txt
          echo "----- Changed files -----"
          cat changed_files.txt

      - name: Verify all changes are bootlogos/*.png
        id: check
        run: |
          set -euo pipefail
          if [ ! -s changed_files.txt ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -vE '^bootlogos/[^/]+\.png$' changed_files.txt; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Approve as bot
        if: steps.check.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr review "$PR_NUMBER" --repo "$REPO" --approve \
            --body "Auto-approved: this PR only adds/updates images under bootlogos/."

      - name: Merge using a real user token (so the push triggers downstream workflows)
        if: steps.check.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.PATCH_APPROVER_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr merge "$PR_NUMBER" --repo "$REPO" --auto --squash --delete-branch

      - name: Leave a note for anything else
        if: steps.check.outputs.eligible == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body \
            "This PR touches files outside \`bootlogos/\`, so it needs a manual review before merging."
