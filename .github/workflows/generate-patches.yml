name: Generate Switch Boot Logo Patches
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Firmware version these patches target (e.g. 22.5.0)'
        required: true
      image:
        description: 'Image filename in /bootlogos to process (without .png), or "all" for every image'
        required: false
        default: 'all'
      note:
        description: 'Optional note'
        required: false
        default: ''
jobs:
  build-patches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Resolve requested image(s)
        id: images
        env:
          IMAGE: ${{ github.event.inputs.image }}
        run: |
          set -euo pipefail
          if [ ! -d "bootlogos" ]; then
            echo "::error::bootlogos/ directory not found in repo"
            exit 1
          fi

          if [ -z "$IMAGE" ] || [ "$IMAGE" = "all" ]; then
            shopt -s nullglob
            files=(bootlogos/*.png)
            if [ ${#files[@]} -eq 0 ]; then
              echo "::error::No .png files found in bootlogos/"
              exit 1
            fi
          else
            candidate="bootlogos/${IMAGE}.png"
            if [ ! -f "$candidate" ]; then
              echo "::error::Requested image '${IMAGE}' not found at ${candidate}"
              exit 1
            fi
            files=("$candidate")
          fi

          # Pass the resolved file list to the next step as a newline-delimited list
          {
            echo "list<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Generate patches and package per image
        env:
          VERSION: ${{ github.event.inputs.version }}
          FILES: ${{ steps.images.outputs.list }}
        run: |
          set -euo pipefail
          mkdir -p "patches/${VERSION}"
          while IFS= read -r img; do
            [ -z "$img" ] && continue
            name=$(basename "$img" .png)
            rm -rf "build/${name}"
            mkdir -p "build/${name}/atmosphere/exefs_patches/Splash"
            python scripts/gen_patches.py \
              -o BootLogo.png \
              "build/${name}/atmosphere/exefs_patches/Splash" \
              "$img"
            # overwrite if it already exists for this version
            rm -f "patches/${VERSION}/${name}.zip"
            ( cd "build/${name}" && zip -r "../../patches/${VERSION}/${name}.zip" atmosphere )
          done <<< "$FILES"
      - name: Open PR with generated patches
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Regenerate boot logo patches for ${{ github.event.inputs.version }}"
          branch: "patches/${{ github.event.inputs.version }}"
          title: "Boot logo patches: ${{ github.event.inputs.version }}"
          body: |
            Auto-generated by the "Generate Switch Boot Logo Patches" workflow.
            Firmware version: ${{ github.event.inputs.version }}
            Image(s): ${{ github.event.inputs.image }}
            Note: ${{ github.event.inputs.note }}
            Merging this PR adds/updates `patches/${{ github.event.inputs.version }}/`.
            Every other version folder is left untouched.
          add-paths: |
            patches/${{ github.event.inputs.version }}/*.zip
          delete-branch: true
