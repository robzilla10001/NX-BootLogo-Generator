name: Generate Switch Boot Logo Patches
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Firmware version these patches target (e.g. 22.5.0)'
        required: true
      image:
        description: 'Image filename in /bootlogos to process (without .png), or "all" for every image'
        required: false
        default: 'all'
      note:
        description: 'Optional note'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'bootlogos/**.png'
permissions:
  contents: write
  pull-requests: write

jobs:
  build-patches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Resolve run parameters
        id: params
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            IMAGE="${{ github.event.inputs.image }}"
            NOTE="${{ github.event.inputs.note }}"
          else
            if [ ! -f "FIRMWARE_VERSION" ]; then
              echo "::error::FIRMWARE_VERSION file not found. Create one at repo root containing e.g. '22.5.0', or run this workflow manually with a version input."
              exit 1
            fi
            VERSION="$(cat FIRMWARE_VERSION | tr -d '[:space:]')"
            IMAGE="all"
            NOTE="Auto-triggered by push to bootlogos/"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "note=${NOTE}" >> "$GITHUB_OUTPUT"
      - name: Resolve requested image(s)
        id: images
        env:
          IMAGE: ${{ steps.params.outputs.image }}
        run: |
          set -euo pipefail
          if [ ! -d "bootlogos" ]; then
            echo "::error::bootlogos/ directory not found in repo"
            exit 1
          fi

          if [ -z "$IMAGE" ] || [ "$IMAGE" = "all" ]; then
            shopt -s nullglob
            files=(bootlogos/*.png)
            if [ ${#files[@]} -eq 0 ]; then
              echo "::error::No .png files found in bootlogos/"
              exit 1
            fi
          else
            candidate="bootlogos/${IMAGE}.png"
            if [ ! -f "$candidate" ]; then
              echo "::error::Requested image '${IMAGE}' not found at ${candidate}"
              exit 1
            fi
            files=("$candidate")
          fi

          # Pass the resolved file list to the next step as a newline-delimited list
          {
            echo "list<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Generate patches and package per image
        env:
          VERSION: ${{ steps.params.outputs.version }}
          FILES: ${{ steps.images.outputs.list }}
        run: |
          set -euo pipefail
          mkdir -p "patches/${VERSION}"
          while IFS= read -r img; do
            [ -z "$img" ] && continue
            name=$(basename "$img" .png)
            rm -rf "build/${name}"
            mkdir -p "build/${name}/atmosphere/exefs_patches/Splash"
            python scripts/gen_patches.py \
              -o BootLogo.png \
              "build/${name}/atmosphere/exefs_patches/Splash" \
              "$img"
            # overwrite if it already exists for this version
            rm -f "patches/${VERSION}/${name}.zip"
            ( cd "build/${name}" && zip -r "../../patches/${VERSION}/${name}.zip" atmosphere )
          done <<< "$FILES"
      - name: Open PR with generated patches
        id: cpr
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Regenerate boot logo patches for ${{ steps.params.outputs.version }}"
          branch: "patches/${{ steps.params.outputs.version }}"
          title: "Boot logo patches: ${{ steps.params.outputs.version }}"
          body: |
            Auto-generated by the "Generate Switch Boot Logo Patches" workflow.
            Firmware version: ${{ steps.params.outputs.version }}
            Image(s): ${{ steps.params.outputs.image }}
            Note: ${{ steps.params.outputs.note }}
            Merging this PR adds/updates `patches/${{ steps.params.outputs.version }}/`.
            Every other version folder is left untouched.
          add-paths: |
            patches/${{ steps.params.outputs.version }}/*.zip
          delete-branch: true
      - name: Approve and enable auto-merge (as a separate bot identity)
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.PATCH_APPROVER_TOKEN }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          gh pr review "$PR_NUMBER" --repo "${{ github.repository }}" --approve \
            --body "Auto-approved: generated boot logo patch set."
          gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" \
            --auto --squash --delete-branch
